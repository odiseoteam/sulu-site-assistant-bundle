name: Build

on:
    push:
        branches-ignore:
            - 'dependabot/**'
        paths-ignore:
            - "*.md"
            - "doc/**"
    pull_request:
        paths-ignore:
            - "*.md"
            - "doc/**"
    schedule:
        -
            cron: "0 1 * * 6" # Saturdays: dependencies move without a push
    workflow_dispatch: ~

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        runs-on: ubuntu-latest
        name: "PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, ${{ matrix.database }}"

        strategy:
            fail-fast: false
            matrix:
                php: ["8.2", "8.3", "8.4"]
                symfony: ["^7.4"]
                database: ["mysql"]
                include:
                    # The migrations ship for both platforms: this job proves the PostgreSQL ones apply.
                    - php: "8.4"
                      symfony: "^7.4"
                      database: "postgres"

        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: root
                ports: ["3306:3306"]
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20
            postgres:
                image: postgres:16
                env:
                    POSTGRES_PASSWORD: postgres
                ports: ["5432:5432"]
                options: >-
                    --health-cmd=pg_isready
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20

        env:
            DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:postgres@127.0.0.1:5432/site_assistant?serverVersion=16&charset=utf8' || 'mysql://root:root@127.0.0.1:3306/site_assistant?serverVersion=8.4&charset=utf8mb4' }}

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: "${{ matrix.php }}"
                  extensions: intl, gd, sodium, pdo_mysql, pdo_pgsql
                  tools: composer:v2, flex
                  coverage: none

            - name: Pin the Symfony line
              run: composer config extra.symfony.require "${{ matrix.symfony }}"

            - run: composer config --unset platform.php
            - run: composer update --no-interaction --no-progress --prefer-dist
            - run: composer validate --strict

            - uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - run: npm install --no-audit --no-fund

            - name: Run Vitest
              run: npx vitest run

            - name: Check the built widget is up to date
              run: npm run build && git diff --exit-code -- public/

            - name: Lint the containers
              run: |
                  tests/Application/bin/console lint:container --env=test
                  SULU_CONTEXT=website tests/Application/bin/console lint:container --env=test

            - run: vendor/bin/php-cs-fixer fix --dry-run --diff
            - run: vendor/bin/phpstan analyse --memory-limit=2G
            - run: vendor/bin/deptrac analyse --config-file=deptrac.yaml --no-progress
            - run: vendor/bin/composer-dependency-analyser

            # The bootstrap builds the bundle's tables from its migrations and fails when they do not
            # match the mapping.
            - name: Run PHPUnit
              run: vendor/bin/phpunit
