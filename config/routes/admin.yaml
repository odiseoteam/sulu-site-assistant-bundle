# The admin API behind the "Site assistant" section. Import it under /admin/api.
odiseo_sulu_site_assistant.get_conversations:
    path: /site-assistant/conversations.{_format}
    format: json
    methods: [GET]
    controller: odiseo_sulu_site_assistant.admin.conversation_controller::cgetAction

odiseo_sulu_site_assistant.get_conversation:
    path: /site-assistant/conversations/{id}.{_format}
    format: json
    methods: [GET]
    requirements: { id: '\d+' }
    controller: odiseo_sulu_site_assistant.admin.conversation_controller::getAction

odiseo_sulu_site_assistant.delete_conversation:
    path: /site-assistant/conversations/{id}.{_format}
    format: json
    methods: [DELETE]
    requirements: { id: '\d+' }
    controller: odiseo_sulu_site_assistant.admin.conversation_controller::deleteAction

odiseo_sulu_site_assistant.delete_conversations:
    path: /site-assistant/conversations.{_format}
    format: json
    methods: [DELETE]
    controller: odiseo_sulu_site_assistant.admin.conversation_controller::cdeleteAction

odiseo_sulu_site_assistant.get_handoffs:
    path: /site-assistant/handoffs.{_format}
    format: json
    methods: [GET]
    controller: odiseo_sulu_site_assistant.admin.handoff_controller::cgetAction

odiseo_sulu_site_assistant.get_handoff:
    path: /site-assistant/handoffs/{id}.{_format}
    format: json
    methods: [GET]
    requirements: { id: '\d+' }
    controller: odiseo_sulu_site_assistant.admin.handoff_controller::getAction

odiseo_sulu_site_assistant.put_handoff:
    path: /site-assistant/handoffs/{id}.{_format}
    format: json
    methods: [PUT]
    requirements: { id: '\d+' }
    controller: odiseo_sulu_site_assistant.admin.handoff_controller::putAction

odiseo_sulu_site_assistant.get_statistics:
    path: /site-assistant/statistics.{_format}
    format: json
    methods: [GET]
    controller: odiseo_sulu_site_assistant.admin.statistics_controller::getAction

odiseo_sulu_site_assistant.get_settings_list:
    path: /site-assistant/settings.{_format}
    format: json
    methods: [GET]
    controller: odiseo_sulu_site_assistant.admin.settings_controller::cgetAction

odiseo_sulu_site_assistant.get_settings:
    path: /site-assistant/settings/{id}.{_format}
    format: json
    methods: [GET]
    controller: odiseo_sulu_site_assistant.admin.settings_controller::getAction

odiseo_sulu_site_assistant.put_settings:
    path: /site-assistant/settings/{id}.{_format}
    format: json
    methods: [PUT]
    controller: odiseo_sulu_site_assistant.admin.settings_controller::putAction

# Rules and knowledge documents share one controller: `section` is rules or documents.
odiseo_sulu_site_assistant.get_rules:
    path: /site-assistant/rules.{_format}
    format: json
    methods: [GET]
    defaults: { section: rules }
