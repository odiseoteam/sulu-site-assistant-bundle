# The bundle's development stack: PHP and a database for the test application.
services:
    php:
        build: .docker/php
        user: "${DOCKER_USER:-1000:1000}"
        environment:
            HOME: /tmp
            COMPOSER_HOME: /tmp/composer
            DATABASE_URL: "${DATABASE_URL:-mysql://root:root@mysql:3306/site_assistant?serverVersion=8.4&charset=utf8mb4}"
        volumes:
            - .:/app
        depends_on:
            mysql:
                condition: service_healthy
        command: ["sleep", "infinity"]

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_ROOT_PASSWORD: root
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
            interval: 2s
            timeout: 3s
            retries: 30
        tmpfs:
            - /var/lib/mysql

    postgres:
        image: postgres:16
        profiles: [postgres]
        environment:
            POSTGRES_PASSWORD: postgres
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "postgres"]
            interval: 2s
            timeout: 3s
            retries: 30
        tmpfs:
            - /var/lib/postgresql/data

    node:
        image: node:22-alpine
        user: "${DOCKER_USER:-1000:1000}"
        working_dir: /app
        environment:
            HOME: /tmp
        volumes:
            - .:/app
        profiles: [node]
